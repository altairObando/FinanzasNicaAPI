# nginx/default.conf

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Resuelve "django" en cada petición para sobrevivir a reinicios del contenedor
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_backend django:8000;

    # Tamaño máximo de subida de archivos (ajústalo según necesites)
    client_max_body_size 10M;

    # 📁 Archivos MEDIA (imágenes subidas por usuarios)
    # Un archivo puede reemplazarse conservando el nombre, por eso no se marca
    # como "immutable" (evita servir versiones obsoletas desde la caché).
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 📁 Archivos STATIC (CSS, JS, admin de Django)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 🔄 Todo lo demás va a Django
    location / {
        proxy_pass http://$django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
